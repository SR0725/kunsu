[workspace]
resolver = "2"
members = ["crates/kunsu-core", "crates/kunsu-mobile", "crates/kunsu-server", "crates/kunsu-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# core 不需要 clock feature——純函數層絕不讀系統時間（now 一律由呼叫端傳入）
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
toml = "0.8"
# server 層（core 永不 import 這些）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "io-util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tempfile = "3"
# HTTP/協定層（本波：axum HTTP + MCP + WS + 簽章鏈 + Discord webhook）
axum = { version = "0.8", features = ["ws"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
