<title>軍師一問一答融合版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: concept switcher on top; a phone frame on the left, the concept's reasoning on the right (stacked on phones). */
:root {
  --canvas: #ffffff; --page: #eef0f3; --card: #f6f7f9; --raised: #eceef2; --line: #e1e4e9; --line2: #cfd3da;
  --strong: #111318; --on-strong: #ffffff; --body: #3a3e46; --muted: #646973; --faint: #a3a8b0;
  --waiting: #8a5a00; --waiting-bg: rgb(201 140 20 / .14); --danger: #b42318; --ok: #1f7a3a; --accent: #2563eb; --accent-bg: rgb(37 99 235 / .1);
  --frame: #d5d8de; --frame-in: #f2f3f5; --scrim: rgb(20 22 28 / .35); --hud: rgb(250 250 252 / .95); --shadow: rgb(20 22 28 / .18);
  --t0: #c4433b; --t1: #2f68cc; --t2: #b88317; --t3: #36884c; --tile-ink: #ffffff;
  color-scheme: light;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #000000; --page: #060708; --card: #0b0c0e; --raised: #15171b; --line: #1f2228; --line2: #2b2f37;
  --strong: #f2f3f5; --on-strong: #000000; --body: #c3c7ce; --muted: #8b919b; --faint: #5f6570;
  --waiting: #d9b26a; --waiting-bg: rgb(217 178 106 / .14); --danger: #ef8d86; --ok: #83c494; --accent: #3987e5; --accent-bg: rgb(57 135 229 / .15);
  --frame: #23262c; --frame-in: #0c0d10; --scrim: rgb(0 0 0 / .55); --hud: rgb(40 42 48 / .92); --shadow: rgb(0 0 0 / .5);
  --t0: #8e3b3b; --t1: #2e5c9e; --t2: #8f6b22; --t3: #3a7448; --tile-ink: #ffffff;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --canvas: #000000; --page: #060708; --card: #0b0c0e; --raised: #15171b; --line: #1f2228; --line2: #2b2f37;
  --strong: #f2f3f5; --on-strong: #000000; --body: #c3c7ce; --muted: #8b919b; --faint: #5f6570;
  --waiting: #d9b26a; --waiting-bg: rgb(217 178 106 / .14); --danger: #ef8d86; --ok: #83c494; --accent: #3987e5; --accent-bg: rgb(57 135 229 / .15);
  --frame: #23262c; --frame-in: #0c0d10; --scrim: rgb(0 0 0 / .55); --hud: rgb(40 42 48 / .92); --shadow: rgb(0 0 0 / .5);
  --t0: #8e3b3b; --t1: #2e5c9e; --t2: #8f6b22; --t3: #3a7448; --tile-ink: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--body); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; }

.top { padding-inline: 16px; padding-block: 16px 12px; max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.top h1 { margin: 0; font-size: 17px; color: var(--strong); font-weight: 700; letter-spacing: .02em; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--body); font-size: 14px; background: var(--card); }
.tabs button[aria-pressed="true"] { background: var(--strong); color: var(--on-strong); border-color: var(--strong); font-weight: 700; }
.tabs .n { font-family: var(--mono); font-size: 12px; opacity: .7; margin-right: 6px; }
.reset { margin-left: auto; color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
.reset:hover { color: var(--strong); background: var(--card); }

.stage { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; display: grid; grid-template-columns: 392px minmax(0, 1fr); gap: 40px; align-items: start; }
.phone { position: relative; width: 392px; height: min(840px, calc(100vh - 96px)); min-height: 620px; border-radius: 46px; border: 1px solid var(--frame); background: var(--canvas); overflow: hidden; box-shadow: 0 30px 80px var(--shadow), inset 0 0 0 6px var(--frame-in); }
.notes { padding-top: 8px; max-width: 62ch; }
.notes h2 { margin: 0 0 6px; color: var(--strong); font-size: 24px; line-height: 1.25; text-wrap: balance; }
.notes .one { color: var(--body); font-size: 16px; margin: 0 0 20px; }
.notes h3 { margin: 22px 0 8px; font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.notes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.notes li { line-height: 1.6; }
.notes .try { margin-top: 24px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.notes .try b { color: var(--strong); }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-inline: 0; }
  .phone { width: 100%; height: calc(100dvh - 110px); min-height: 560px; border-radius: 0; border: 0; box-shadow: none; }
  .notes { padding-inline: 16px; }
  .reset { margin-left: 0; }
}

/* ---------- phone internals ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; color: var(--body); }
.sbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font: 600 15px var(--sans); color: var(--strong); }
.sbar i { display: inline-block; width: 24px; height: 11px; border: 1.5px solid var(--strong); border-radius: 3px; position: relative; }
.sbar i::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: var(--strong); border-radius: 1px; }
@media (max-width: 860px) { .sbar { display: none; } }

.hdr { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 16px 10px; min-height: 52px; border-bottom: 1px solid var(--line); }
.hdr .t { color: var(--strong); font-weight: 700; font-size: 17px; }
.hdr .sub { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.hdr .sp { flex: 1; }
.back { display: flex; align-items: center; gap: 2px; color: var(--strong); font-size: 16px; min-height: 44px; padding-right: 6px; }
.big { font-size: 30px; font-weight: 700; color: var(--strong); padding: 4px 16px 6px; }
.conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

.body { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.pad { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px; }

.mark { flex: none; display: inline-block; vertical-align: middle; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--mono); }
.wait { color: var(--waiting); }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); color: var(--strong); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.chip.ghost { background: transparent; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.pill { min-height: 52px; width: 100%; border-radius: 999px; background: var(--strong); color: var(--on-strong); font-weight: 700; font-size: 16px; }
.pill[disabled] { opacity: .35; cursor: default; }
.rec { font-size: 11px; font-weight: 700; color: var(--accent); background: var(--accent-bg); padding: 2px 6px; border-radius: 999px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.cmd { font-family: var(--mono); font-size: 14px; color: var(--strong); background: var(--canvas); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }

.composer { flex: none; border-top: 1px solid var(--line); padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--canvas); }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--raised); color: var(--strong); padding: 0 16px; }
.inrow input::placeholder { color: var(--faint); }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--strong); color: var(--on-strong); font-weight: 800; flex: none; font-size: 18px; }

.me { align-self: flex-end; max-width: 82%; background: var(--raised); color: var(--strong); padding: 9px 14px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; }
.ai { max-width: 92%; color: var(--body); white-space: pre-wrap; line-height: 1.6; }
.tool { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.sys { align-self: center; font-size: 12px; color: var(--muted); text-align: center; }

.row { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .nm { color: var(--strong); font-weight: 700; font-size: 16px; }
.row .pv { color: var(--body); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--waiting-bg); color: var(--waiting); white-space: nowrap; }
.tag.run { background: var(--accent-bg); color: var(--accent); }
.tag.idle { background: var(--raised); color: var(--muted); }

/* inline keyboard under a bubble (Telegram style) */
.kb { display: grid; gap: 6px; margin-top: 8px; }
.kb button { min-height: 44px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); color: var(--strong); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; }
.kb button.primary { background: var(--strong); color: var(--on-strong); border-color: var(--strong); }
.qbub { background: var(--card); border: 1px solid var(--line); border-radius: 18px 18px 18px 6px; padding: 12px 14px; max-width: 92%; }
.qbub .q { color: var(--strong); font-weight: 700; font-size: 16px; line-height: 1.45; }

/* toast + sheets */
.toast { position: absolute; left: 12px; right: 12px; top: 52px; z-index: 30; background: var(--raised); border: 1px solid var(--line2); border-radius: 16px; padding: 10px 12px 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px var(--shadow); }
@media (max-width: 860px) { .toast { top: 8px; } }
.toast .tx { flex: 1; min-width: 0; }
.toast .tx b { color: var(--strong); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .tx span { font-size: 12px; color: var(--muted); }
.toast .bar { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; background: var(--muted); border-radius: 2px; transform-origin: left; animation: drain 5s linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.toast button { color: var(--strong); font-weight: 800; min-height: 44px; padding: 0 8px; }
.sheet-bg { position: absolute; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 92%; background: var(--canvas); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 8px auto 2px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); width: 100%; }
.opt .k { width: 28px; height: 28px; border-radius: 8px; background: var(--raised); color: var(--body); font: 700 14px var(--mono); display: grid; place-items: center; flex: none; }
.opt[aria-checked="true"] { border: 2px solid var(--strong); padding: 13px; }
.opt[aria-checked="true"] .k { background: var(--strong); color: var(--on-strong); }
.opt .l { color: var(--strong); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sign { border: 1px solid var(--waiting); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; background: var(--card); }
.sign div { display: flex; justify-content: space-between; gap: 12px; }
.sign span:first-child { color: var(--muted); }
.sign span:last-child { color: var(--strong); text-align: right; font-variant-numeric: tabular-nums; }
.face { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: var(--scrim); }
.face div { background: var(--hud); border-radius: 22px; padding: 26px 30px; text-align: center; color: var(--strong); font-size: 13px; }
.face svg { display: block; margin: 0 auto 10px; }

/* focus concept */
.dots { display: flex; gap: 5px; }
.dots i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--strong); }
.dots i.done { background: var(--muted); }
.slide { animation: slide .24s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.fq { color: var(--strong); font-size: 24px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.ctx { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 6px; }

/* bottom tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); padding-bottom: 14px; background: var(--canvas); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: var(--muted); font-size: 11px; font-weight: 600; min-height: 52px; position: relative; }
.tabbar button[aria-current="page"] { color: var(--strong); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: var(--on-strong); font: 700 11px/18px var(--mono); }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--waiting-bg); border: 1px solid var(--waiting); color: var(--waiting); font-size: 14px; text-align: left; width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .slide, .sheet, .toast .bar { animation: none; }
}

/* ---------- 融合版 ---------- */
.theme-row { display: flex; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg.old { opacity: .72; }
.av { flex: none; width: 28px; padding-top: 2px; }
.qbub2 { flex: 1; min-width: 0; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 6px 18px 18px 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.qbub2.live { border-color: var(--line2); box-shadow: 0 1px 0 var(--line2); }
.qbub2.plain { flex: 0 1 auto; color: var(--strong); }
.src { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.src b { color: var(--body); }
.qq { color: var(--strong); font-size: 16px; font-weight: 700; line-height: 1.5; white-space: pre-wrap; text-wrap: pretty; }
.qd { font-size: 14px; color: var(--body); }
.legend { display: grid; gap: 6px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.legend b { color: var(--body); }
.lg { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: var(--tile-ink); font-size: 10px; margin-right: 6px; vertical-align: 1px; }
.lg.c0, .tile.c0 { background: var(--t0); } .lg.c1, .tile.c1 { background: var(--t1); }
.lg.c2, .tile.c2 { background: var(--t2); } .lg.c3, .tile.c3 { background: var(--t3); }
.follow { border-top: 1px dashed var(--line2); padding-top: 8px; display: grid; gap: 4px; font-size: 14px; }
.fq2 { color: var(--muted); font-size: 13px; }
.foldbtn { align-self: flex-start; font-size: 13px; color: var(--muted); min-height: 32px; }
.mine { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 82%; }
.mine .me { max-width: 100%; }
.tick { font-size: 12px; color: var(--muted); text-align: right; }
.tick.wait { color: var(--waiting); } .tick.run { color: var(--accent); } .tick.ok { color: var(--muted); }
#chat { position: relative; }
#chat > .pad { min-height: 100%; justify-content: flex-end; will-change: transform; }
.pullind { position: absolute; left: 0; right: 0; top: 10px; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); opacity: 0; pointer-events: none; }
.pullind svg { display: block; }
.pullind .ring-bg { stroke: var(--line2); }
.pullind .ring { stroke: var(--strong); transition: stroke-dashoffset .05s linear; }
.pullind.ready { color: var(--strong); }
.pullind.loading svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.reveal { animation: reveal .45s ease-out both; }
@keyframes reveal { from { opacity: 0; transform: translateY(-12px); } }
.tagi { display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.6; color: var(--waiting); background: var(--waiting-bg); padding: 0 8px; border-radius: 999px; margin-right: 8px; vertical-align: 2px; white-space: nowrap; }
.tagi.done { color: var(--muted); background: var(--raised); }
.pendrow { display: flex; flex-direction: column; align-items: flex-start; }
.pendrow .phead { padding: 2px 0; min-height: 40px; }
.pendrow .plist { margin-top: 6px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .reveal, .pullind.loading svg { animation: none; } }
.daysep { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); margin: 4px 0; }
.daysep::before, .daysep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.daysep.now { color: var(--strong); font-weight: 700; }
.pend { flex: 0 1 auto; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 6px 18px 18px 18px; overflow: hidden; }
.phead { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; min-height: 44px; font-size: 14px; color: var(--body); text-align: left; }
.stack { display: flex; }
.stk { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--raised); border: 2px solid var(--card); margin-left: -8px; position: relative; }
.stk:first-child { margin-left: 0; }
.chev { color: var(--muted); }
.plist { border-top: 1px solid var(--line); display: grid; }
.plist button { display: flex; gap: 8px; align-items: center; padding: 10px 14px; min-height: 44px; text-align: left; font-size: 13px; color: var(--body); border-bottom: 1px solid var(--line); }
.plist button span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist b { color: var(--strong); }
.plist .go { flex: none; font-size: 12px; color: var(--accent); }
.quiet { display: flex; gap: 4px; align-items: center; }
.quiet button { font-size: 13px; color: var(--muted); padding: 0 8px; min-height: 36px; border-radius: 8px; }
.quiet button:hover { color: var(--strong); background: var(--raised); }
.tiles { display: grid; gap: 8px; }
.tiles.two { grid-template-columns: 1fr 1fr; }
.tile { position: relative; color: var(--tile-ink); border-radius: 14px; min-height: 64px; padding: 10px 12px 12px; text-align: left; display: flex; align-items: flex-end; box-shadow: inset 0 -4px 0 rgb(0 0 0 / .22); transition: transform .08s, box-shadow .08s; }
.tiles.one .tile { min-height: 54px; align-items: center; padding-left: 40px; }
.tile:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .22); }
.tile .shp { position: absolute; left: 12px; top: 9px; font-size: 13px; opacity: .9; }
.tiles.one .tile .shp { top: 50%; transform: translateY(-50%); }
.tile .tl { font-weight: 700; font-size: 16px; line-height: 1.35; display: flex; flex-direction: column; gap: 1px; padding-right: 58px; }
.tiles.two .tile .tl { padding-right: 0; padding-top: 14px; }
.tile .key { font: 700 12px var(--mono); opacity: .8; }
.tile .tsub { font-size: 12px; font-weight: 500; opacity: .85; }
.trec { position: absolute; right: 8px; top: 8px; font-size: 10px; font-weight: 700; background: rgb(255 255 255 / .22); padding: 2px 6px; border-radius: 999px; }
.plus { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); border: 1px solid var(--line); color: var(--strong); font-size: 20px; flex: none; }
.send[disabled], .inrow input:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

function queue(label, apply, revert, commit) {

function undo() {

function resume(sid) {

  queue(`「${d.opts[idx].l}」`, () => { S.decisions.splice(i, 1); afterDecision(d, d.opts[idx].l); },

const phone = document.getElementById("phone");

function render() {
  const chat = document.getElementById("chat");
  const prev = chat ? { top: chat.scrollTop, h: chat.scrollHeight } : null;
  const atBottom = !chat || chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60;
  const keep = document.getElementById("msg");
  const draft = keep ? keep.value : "", hadFocus = document.activeElement === keep;
  phone.innerHTML = `<div class="scr">${screen()}</div>${overlays()}`;
  const inp = document.getElementById("msg");

  const c = document.getElementById("chat");
  if (S.ui.anchor === "prepend" && prev) c.scrollTop = c.scrollHeight - prev.h + prev.top;
  else if (S.ui.anchor === "keep" && prev) c.scrollTop = prev.top;
  else if (atBottom || stick) c.scrollTop = c.scrollHeight;

}
/* 往下拉看稍早：圓圈跟著拉的距離填滿，拉滿放開才展開 */
const PULL_FULL = 90;
let pull = 0, touchY = null, wheelTimer = null, pullBusy = false;
const moreDays = () => S.ui.loadedDays < DAYS.length;
function paintPull() {
  const c = document.getElementById("chat"); if (!c) return;
  const ind = document.getElementById("pullind"), pad = c.querySelector(".pad"), ring = ind.querySelector(".ring");
  const r = Math.min(pull / PULL_FULL, 1);
  pad.style.transform = pull ? `translateY(${Math.min(pull, PULL_FULL * 1.25)}px)` : "";
  ind.style.opacity = pullBusy ? 1 : Math.max(0, Math.min((pull - 16) / 30, 1));
  ring.setAttribute("stroke-dashoffset", pullBusy ? 52 : (69.1 * (1 - r)).toFixed(1));
  ind.classList.toggle("ready", r >= 1 && !pullBusy);
  ind.classList.toggle("loading", pullBusy);
  document.getElementById("pulltext").textContent = pullBusy ? "載入稍早的紀錄…" : !moreDays() ? "沒有更早的紀錄了" : r >= 1 ? "放開就展開稍早的紀錄" : "往下拉，看稍早的紀錄";
}
function springBack() {
  const c = document.getElementById("chat"); const pad = c && c.querySelector(".pad");
  if (pad) { pad.style.transition = "transform .25s ease-out"; setTimeout(() => { if (pad) pad.style.transition = ""; }, 260); }
  pull = 0; paintPull();
}
function releasePull() {
  if (pullBusy) return;
  if (pull >= PULL_FULL && moreDays()) {
    pullBusy = true; pull = 48; paintPull();
    setTimeout(() => {
      pullBusy = false; pull = 0; S.ui.loadedDays++; S.ui.anchor = "prepend"; render();
      const c = document.getElementById("chat"); c.scrollTo({ top: Math.max(0, c.scrollTop - 260), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }, 550);
  } else springBack();
}
function attachPull(c) {
  c.addEventListener("touchstart", e => { touchY = c.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  c.addEventListener("touchmove", e => {
    if (touchY == null || pullBusy) return;
    const dy = e.touches[0].clientY - touchY;
    if (dy > 0 && c.scrollTop <= 0) { e.preventDefault(); pull = dy * 0.6; paintPull(); }
  }, { passive: false });
  c.addEventListener("touchend", () => { if (touchY != null) releasePull(); touchY = null; });
  c.addEventListener("wheel", e => {
    if (pullBusy) { e.preventDefault(); return; }
    if (c.scrollTop <= 0 && e.deltaY < 0) {
      e.preventDefault(); pull = Math.min(pull + (-e.deltaY) * 0.35, PULL_FULL * 1.3); paintPull();
      clearTimeout(wheelTimer); wheelTimer = setTimeout(releasePull, 180);
    } else if (pull && e.deltaY > 0) { e.preventDefault(); pull = Math.max(0, pull - e.deltaY * 0.35); paintPull(); clearTimeout(wheelTimer); wheelTimer = setTimeout(releasePull, 180); }
  }, { passive: false });
}

    case "ctx": if (!it) break; {
      const sid = it.kind === "decision" ? it.d.session : it.s.id, s = sid && S.sessions[sid];
      cur.asks.push(s ? { q: "前因後果？", quote: s.turns.slice(-4).map(t => t.u ? "你：" + t.u : t.t ? "⚙︎ " + t.t : t.a ? "AI：" + t.a.split("\n")[0] : t.sys) } : { q: "前因後果？", a: "這題是排程直接問你的，沒有對應的對話。" });
      render(); break; }
    case "fold": S.ui.openAsks[v] = !S.ui.openAsks[v]; S.ui.anchor = "keep"; render(); break;
    case "pend": S.ui.pendingOpen = !S.ui.pendingOpen; S.ui.anchor = S.ui.pendingOpen ? null : "keep"; stick = S.ui.pendingOpen; render(); break;
    case "jump": { if (cur) S.ex.pop(); S.skipped = items().map(x => x.id).filter(x => x !== v); S.ui.pendingOpen = false; askNext(); stick = true; render(); break; }
    case "skip": if (!cur) break; S.skipped = S.skipped.filter(x => x !== cur.item); S.skipped.push(cur.item); cur.answer = "等下再說"; cur.agent = it.kind === "decision" ? it.d.agent : it.s.agent; askNext(); stick = true; render(); break;
    case "nf": if (S.ui.newflow) break; if (cur && !cur.asks.length) S.ex.pop(); S.ui.newflow = {}; S.ex.push({ id: "q" + Date.now(), kind: "new", text: "要開新對話給誰？" }); stick = true; render(); break;
    case "nfa": S.ui.newflow.agent = v; S.ex[S.ex.length - 1].answer = AGENT[v]; S.ex.push({ id: "q" + Date.now(), kind: "new", text: "哪個專案？" }); stick = true; render(); break;
    case "nfp": S.ui.newflow.project = v; S.ex[S.ex.length - 1].answer = v; S.ex.push({ id: "q" + Date.now(), kind: "new", text: "要做什麼？直接打字。" }); stick = true; render(); document.getElementById("msg").focus(); break;
    case "nfx": S.ui.newflow = null; while (S.ex.length && S.ex[S.ex.length - 1].kind === "new") S.ex.pop(); askNext(); stick = true; render(); break;
  }
});

}
