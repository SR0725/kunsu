  .notes { padding-inline: 16px; }
  .reset { margin-left: 0; }

.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: var(--muted); font-size: 11px; font-weight: 600; min-height: 52px; position: relative; }

.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #000; font: 700 11px/18px var(--mono); }

}

/* ---------- 畫面 ---------- */
const clockIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>`;
function bubble(m, active) {
  if (m.me) return `<div class="me">${esc(m.me)}</div>`;
  if (m.quote) return `<div style="display:flex;gap:8px;align-items:flex-end">${mark("k", 22)}<div class="qbub"><div class="meta" style="margin-bottom:6px">${esc(m.k)}</div><div class="ctx">${m.quote.map(l => `<div style="white-space:pre-wrap">${esc(l)}</div>`).join("")}</div></div></div>`;
  let extra = "";
  if (m.briefList && S.flow.waitingStart) {
    extra = `<div class="kb">${items().map(it => { const a = it.kind === "decision" ? it.d.agent : it.s.agent; const n = it.kind === "decision" ? it.d.project : nameOf(it.s); const t = it.kind === "decision" ? it.d.q : it.kind === "perm" ? "要執行 " + it.s.perm.cmd : "等你回話";
      return `<button data-a="bjump" data-v="${it.id}" style="justify-content:flex-start;text-align:left;font-weight:500">${mark(a, 16)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>${esc(n)}</b>　${esc(t)}</span></button>`; }).join("")}</div>`;
  }
  if (m.recap) extra = `<div class="kb"><button data-a="hist">看這次的紀錄</button></div>`;
  return `<div style="display:flex;gap:8px;align-items:flex-end">${mark(m.mk || "k", 22)}<div class="qbub" style="${active ? "border-color:#3a3e46" : "opacity:.85"}">
    <div style="white-space:pre-wrap;color:var(--strong)">${esc(m.k)}</div>${m.cmd ? `<div class="cmd" style="margin:8px 0">${esc(m.cmd)}</div><div class="meta" style="white-space:pre-wrap">${esc(m.k2)}</div>` : ""}${extra}</div></div>`;
}
function chatHTML() {
  const out = [];
  if (O().collapse) {
    const seen = new Set();
    S.chat.forEach(m => {
      const head = S.chat.find(x => x.ex === m.ex && x.ask);
      if (head && head.done && m.ex) {
        if (seen.has(m.ex)) return; seen.add(m.ex);
        out.push(`<button class="sys" data-a="hist" data-v="${esc(head.proj)}" style="display:flex;gap:6px;align-items:center;min-height:32px;padding:0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line)">${mark(head.mk, 14)}<span style="color:var(--ok)">✓</span> ${esc(head.done)} → ${esc(head.proj)}</button>`);
        return;
      }
      out.push(bubble(m, m.ask && m.ask === S.flow.current));
    });
    return out.join("");
  }
  return S.chat.map(m => bubble(m, m.ask && m.ask === S.flow.current)).join("");
}
function pullHTML() {
  if (!O().pull) return "";
  const n = S.history.length;
  if (!S.ui.pullOpen) return `<button class="sys" data-a="pull" style="min-height:40px;width:100%;border-bottom:1px dashed var(--line)">↑ 稍早 · ${n} 則問答</button>`;
  let day = "", h = `<button class="sys" data-a="pull" style="min-height:40px;width:100%">收起稍早的 ↓</button>`;
  [...S.history].reverse().forEach(x => {
    if (x.day !== day) { day = x.day; h += `<div class="sys" style="margin:6px 0">— ${day} —</div>`; }
    h += `<div style="display:flex;gap:8px;align-items:flex-end;opacity:.6">${mark(x.agent, 18)}<div class="qbub" style="padding:8px 12px"><div class="meta">${esc(x.project)} · ${x.time}</div><div style="font-size:14px">${esc(x.q)}</div></div></div>
      <div class="me" style="opacity:.6;font-size:14px">${esc(x.a)}</div><div class="sys" style="opacity:.7">${esc(x.res)}</div>`;
  });
  return h + `<div class="sys" style="margin:8px 0;color:var(--strong)">— 這次 —</div>`;
}
function historySheet(filter) {
  const projects = [...new Set(S.history.map(x => x.project))];
  const list = S.history.filter(x => !filter || x.project === filter);
  let day = "", rows = "";
  list.forEach(x => {
    if (x.day !== day) { day = x.day; rows += `<div class="lbl" style="margin-top:8px">${day}</div>`; }
    rows += `<div class="card" style="gap:6px"><div class="meta" style="display:flex;gap:8px;align-items:center">${mark(x.agent, 16)}<b style="color:var(--body)">${esc(x.project)}</b><span style="flex:1"></span>${x.time}</div>
      <div style="font-size:14px">${esc(x.q)}</div><div style="color:var(--strong);font-weight:700">你：${esc(x.a)}</div><div class="meta">${esc(x.res)}</div></div>`;
  });
  return `<div class="hdr" style="border:0"><div class="t">紀錄</div><span class="sp"></span><button class="meta" data-a="close" style="min-height:44px">關閉</button></div>
    <div style="padding:0 16px 8px"><div class="chips"><button class="chip ${!filter ? "on" : ""}" data-a="hfilter" data-v="">全部</button>${projects.map(p => `<button class="chip ${filter === p ? "on" : ""}" data-a="hfilter" data-v="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>
    <div class="body"><div class="pad" style="padding-top:4px">${rows || '<div class="meta">還沒有紀錄</div>'}</div></div>`;
}
const _sheetHTML = sheetHTML;
sheetHTML = function () {
  if (S.sheet && S.sheet.kind === "history") return `<div class="sheet-bg" data-a="bgclose"><div class="sheet" role="dialog" aria-modal="true" style="height:92%"><div class="grab"></div>${historySheet(S.sheet.filter)}</div></div>`;
  return _sheetHTML();
};

function screen() {
  if (!S.chat.length && !S.opened) { S.opened = true; openVisit(); }
  const list = items(), cur = list.find(i => i.id === S.flow.current);
  const nf = S.ui.newflow;
  let chips = [];
  if (nf) {
    if (!nf.agent) chips = [["Claude", "nf-agent", "claude"], ["Codex", "nf-agent", "codex"]];
    else if (!nf.project) chips = ["kunsu", "ads-review", "blog-site", "demo-shop"].map(p => [p, "nf-proj", p]);
    chips.push(["取消", "nf-cancel", ""]);
  } else if (S.flow.waitingStart) {
    chips = [["開始", "bstart", ""]];
  } else if (cur) {
    if (cur.kind === "decision") chips = cur.d.money ? [["打開核對（Face ID）", "dec", cur.d.id, -1]] : cur.d.opts.map((o, i) => [o.l + (o.rec ? " ★" : ""), "dec", cur.d.id, i]);
    else if (cur.kind === "perm") chips = [["允許一次", "perm", cur.s.id, 1], ["拒絕", "perm", cur.s.id, 0]];
    else chips = (cur.s.quick || ["繼續"]).map(q => [q, "quick", cur.s.id, q]);
    if (O().ask) { chips.push(["為什麼？", "why", cur.id]); chips.push(["前因後果？", "ctx", cur.id]); }
    chips.push(["等下再說", "skip", cur.id]);
  }
  const ghost = a => ["skip", "nf-cancel", "why", "ctx"].includes(a);
  const ph = nf ? (nf.project ? "要做什麼？" : "選一個") : S.flow.waitingStart ? "按「開始」，或從清單選一件" : cur ? (cur.kind === "reply" ? `回覆 ${nameOf(cur.s)}…` : cur.kind === "decision" ? "要補充說明可以打字" : "用上面的按鈕回答") : "跟軍師說…";
  const strip = O().brief && !S.flow.waitingStart && list.length > 1 ? `<div style="display:flex;gap:6px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)" class="meta">接下來 ${list.slice(1).map(it => mark(it.kind === "decision" ? it.d.agent : it.s.agent, 16)).join("")}</div>` : "";
  return `<div class="sbar"><span>23:44</span><i></i></div>
    <div class="hdr">${mark("k", 30)}<div><div class="t">軍師</div><div class="meta" style="font-size:12px">${list.length ? `還有 ${list.length} 件在等你` : "沒有事在等你"}</div></div><span class="sp"></span>
      ${O().historyIcon ? `<button data-a="hist" aria-label="紀錄" style="display:flex;align-items:center;gap:4px;color:var(--body);min-height:44px;padding:0 6px">${clockIcon}<span style="font-size:13px">紀錄</span></button>` : ""}</div>
    ${strip}
    <div class="body" data-bottom><div class="pad">${pullHTML()}${chatHTML()}</div></div>
    <div class="composer"><div class="chips">${chips.map(([l, a, v, i], n) => `<button class="chip ${n === 0 && !ghost(a) ? "on" : ghost(a) ? "ghost" : ""}" data-a="${a}" data-v="${esc(v)}" data-i="${i ?? ""}" data-t="${esc(i ?? "")}">${esc(l)}</button>`).join("")}</div>
      <div class="inrow"><button class="chip" data-a="nf-start" aria-label="開新對話" style="width:44px;padding:0;justify-content:center;font-size:20px">＋</button><input id="msg" placeholder="${esc(ph)}" autocomplete="off" ${cur && cur.kind === "perm" && !nf ? "disabled" : ""}><button class="send" data-a="k-send" aria-label="送出">↑</button></div></div>`;
}

/* ---------- render + events ---------- */
const phone = document.getElementById("phone");
function render() {
  const keep = document.getElementById("msg");
  const draft = keep ? keep.value : "", hadFocus = document.activeElement === keep;
  phone.innerHTML = `<div class="scr">${screen()}</div>${overlays()}`;
  const inp = document.getElementById("msg");
  if (inp && draft) inp.value = draft;
  if (inp && hadFocus) inp.focus();
  if (!S.ui.keepScroll) phone.querySelectorAll("[data-bottom]").forEach(b => b.scrollTop = b.scrollHeight);
  S.ui.keepScroll = false;
}
function renderChrome() {
  document.getElementById("tabs").innerHTML = VORDER.map((k, i) => `<button type="button" data-c="${k}" aria-pressed="${k === V}"><span class="n">3${String.fromCharCode(65 + i)}</span>${VARIANTS[k].title}</button>`).join("");
  const c = VARIANTS[V];
  document.getElementById("notes").innerHTML = `<h2>${c.title}</h2><p class="one">${c.one}</p>
    <h3>好在哪</h3><ul>${c.why.map(x => `<li>${x}</li>`).join("")}</ul>
    <h3>風險</h3><ul>${c.risk.map(x => `<li>${x}</li>`).join("")}</ul>
    <div class="try"><b>試試看：</b>${c.try}</div>
    <h3>五個變化共用的規則</h3><ul><li>每次打開都是乾淨的；以前的問答只在紀錄裡（「往上拉」版放在對話上方，預設收起）。</li><li>軍師一次只問一件，所以你打的字一定是在回這一件。</li><li>沒有完整對話；要看前因後果用追問或紀錄，逐字原文到電腦上看。</li><li>決定題只能用選項回答；動錢要自己選並過 Face ID；其他送出 5 秒內可撤回。</li></ul>`;
}
function setVariant(k) {
  V = k; fresh(); S.history = structuredClone(HIST0); S.flow = { ex: 0 }; S.opened = false; exSeq = 0; wire();
  try { localStorage.setItem("kunsu-chat-variant", k); } catch (e) {}
  renderChrome(); render();
}
function reopen() {
  if (S.toast) { clearTimeout(S.toast.timer); const t = S.toast; S.toast = null; t.commit(); }
  S.sheet = null; openVisit(); render();
}
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) setVariant(b.dataset.c); });
document.getElementById("reset").addEventListener("click", () => setVariant(V));
document.getElementById("reopen").addEventListener("click", reopen);

function excerpt(id) {
  const it = items().find(x => x.id === id); if (!it) return null;
  const sid = it.kind === "decision" ? it.d.session : it.s.id;
  const s = sid && S.sessions[sid];
  return { it, s };
}
phone.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, i = el.dataset.i;
  if (a === "bgclose" && e.target !== el) return;
  const take = () => { const x = document.getElementById("msg"); const t = x ? x.value.trim() : ""; if (x) x.value = ""; return t; };
  switch (a) {
    case "undo": undo(); break;
    case "close": case "bgclose": S.sheet = null; render(); break;
    case "hist": S.sheet = { kind: "history", filter: v || null }; render(); break;
    case "hfilter": S.sheet.filter = v || null; render(); break;
    case "pull": S.ui.pullOpen = !S.ui.pullOpen; S.ui.keepScroll = S.ui.pullOpen; render(); if (S.ui.pullOpen) phone.querySelector("[data-bottom]").scrollTop = 0; break;
    case "dec": { const d = S.decisions.find(x => x.id === v); if (d && d.money) { S.sheet = { kind: "decision", id: v, sel: null }; render(); } else answer(v, +i); break; }
    case "pick": S.sheet.sel = +i; render(); break;
    case "sheetsubmit": answer(S.sheet.id, S.sheet.sel, true); break;
    case "perm": permit(v, i === "1"); break;
    case "quick": send(v, el.dataset.t); break;
    case "skip": S.skipped = S.skipped.filter(x => x !== v); S.skipped.push(v); closeEx("等下再說"); S.ui.visitDone--; const m = S.chat.find(x => x.ask === v); if (m) m.done = null;
      say({ me: "等下再說" }); say({ k: "好，排到最後。" }); askNext(); render(); break;
    case "bstart": S.flow.waitingStart = false; say({ me: "開始" }); askNext(); render(); break;
    case "bjump": S.flow.waitingStart = false; S.skipped = items().map(x => x.id).filter(x => x !== v); say({ me: "先處理這件" }); askNext(); render(); break;
    case "why": { const x = excerpt(v); if (!x) break; say({ me: "為什麼？" });
      if (x.it.kind === "decision") { const r = x.it.d.opts.find(o => o.rec); say({ k: `AI 建議「${r.l}」，理由是：${r.d || "沒有另外說明"}。\n${x.it.d.why}` }); }
      else if (x.it.kind === "perm") say({ k: `${nameOf(x.s)} 修好了 tracker 而且測試通過，下一步是把分支推到遠端，之後才能開 PR。` });
      else say({ k: `它剛做完：${(x.s.turns.filter(t => t.t).pop() || {}).t || "上一步"}，現在要你決定下一步。` });
      render(); break; }
    case "ctx": { const x = excerpt(v); if (!x) break; say({ me: "前因後果？" });
      if (!x.s) say({ k: "這題沒有對應的對話，是排程直接問你的。" });
      else say({ k: `${nameOf(x.s)} 的對話摘錄：`, quote: x.s.turns.slice(-4).map(t => t.u ? "你：" + t.u : t.t ? "⚙︎ " + t.t : t.a ? "AI：" + t.a.split("\n")[0] : "") });
      render(); break; }
    case "nf-start": S.ui.newflow = {}; say({ me: "開新對話" }); say({ k: "要給誰？" }); render(); break;
    case "nf-agent": S.ui.newflow.agent = v; say({ me: AGENT[v] }); say({ k: "哪個專案？" }); render(); break;
    case "nf-proj": S.ui.newflow.project = v; say({ me: v }); say({ k: "要做什麼？直接打字。" }); render(); break;
    case "nf-cancel": S.ui.newflow = null; say({ me: "算了" }); say({ k: "好。" }); render(); break;
    case "k-send": {
      const t = take(); if (!t) break;
      const nf = S.ui.newflow;
      if (nf && nf.project) { S.ui.newflow = null; startNew(nf.agent, nf.project, t); logHist(nf.agent, nf.project, "你開了新對話", t); say({ me: t }); say({ k: `好，開了一段新的 ${AGENT[nf.agent]} 對話在 ${nf.project}，有事我再問你。` }); render(); break; }
      const cur = items().find(x => x.id === S.flow.current);
      if (cur && cur.kind === "reply") send(cur.s.id, t);
      else if (cur && cur.kind === "decision") { say({ me: t }); say({ k: "這題要點選項回答；你打的字我先記成補充說明。" }); render(); }
      else { say({ me: t }); say({ k: "現在沒有事在等你。要開新對話的話按左邊的「＋」。" }); render(); }
      break;
    }
  }
});
phone.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing || e.target.id !== "msg") return;
  const b = phone.querySelector('[data-a="k-send"]'); if (b) b.click();
});

let startV = "clean";
try { startV = localStorage.getItem("kunsu-chat-variant") || "clean"; } catch (e) {}
if (location.hash && VARIANTS[location.hash.slice(1)]) startV = location.hash.slice(1);
setVariant(VARIANTS[startV] ? startV : "clean");
</script>
