<title>軍師手機版四種介面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: concept switcher on top; a phone frame on the left, the concept's reasoning on the right (stacked on phones). */
:root {
  color-scheme: dark;
  --canvas: #000000;
  --page: #060708;
  --card: #0b0c0e;
  --raised: #15171b;
  --line: #1f2228;
  --strong: #f2f3f5;
  --body: #c3c7ce;
  --muted: #8b919b;
  --faint: #5f6570;
  --waiting: #d9b26a;
  --danger: #ef8d86;
  --ok: #83c494;
  --accent: #3987e5;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--body); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; }

.top { padding-inline: 16px; padding-block: 16px 12px; max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.top h1 { margin: 0; font-size: 17px; color: var(--strong); font-weight: 700; letter-spacing: .02em; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--body); font-size: 14px; background: var(--card); }
.tabs button[aria-pressed="true"] { background: var(--strong); color: #000; border-color: var(--strong); font-weight: 700; }
.tabs .n { font-family: var(--mono); font-size: 12px; opacity: .7; margin-right: 6px; }
.reset { margin-left: auto; color: var(--muted); font-size: 13px; padding: 6px 10px; border-radius: 8px; }
.reset:hover { color: var(--strong); background: var(--card); }

.stage { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; display: grid; grid-template-columns: 392px minmax(0, 1fr); gap: 40px; align-items: start; }
.phone { position: relative; width: 392px; height: min(840px, calc(100vh - 96px)); min-height: 620px; border-radius: 46px; border: 1px solid #23262c; background: var(--canvas); overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / .6), inset 0 0 0 6px #0c0d10; }
.notes { padding-top: 8px; max-width: 62ch; }
.notes h2 { margin: 0 0 6px; color: var(--strong); font-size: 24px; line-height: 1.25; text-wrap: balance; }
.notes .one { color: var(--body); font-size: 16px; margin: 0 0 20px; }
.notes h3 { margin: 22px 0 8px; font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.notes ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.notes li { line-height: 1.6; }
.notes .try { margin-top: 24px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.notes .try b { color: var(--strong); }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-inline: 0; }
  .phone { width: 100%; height: calc(100dvh - 110px); min-height: 560px; border-radius: 0; border: 0; box-shadow: none; }
  .notes { padding-inline: 16px; }
  .reset { margin-left: 0; }
}

/* ---------- phone internals ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; color: var(--body); }
.sbar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font: 600 15px var(--sans); color: var(--strong); }
.sbar i { display: inline-block; width: 24px; height: 11px; border: 1.5px solid var(--strong); border-radius: 3px; position: relative; }
.sbar i::after { content: ""; position: absolute; inset: 1.5px 6px 1.5px 1.5px; background: var(--strong); border-radius: 1px; }
@media (max-width: 860px) { .sbar { display: none; } }

.hdr { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 16px 10px; min-height: 52px; border-bottom: 1px solid var(--line); }
.hdr .t { color: var(--strong); font-weight: 700; font-size: 17px; }
.hdr .sub { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.hdr .sp { flex: 1; }
.back { display: flex; align-items: center; gap: 2px; color: var(--strong); font-size: 16px; min-height: 44px; padding-right: 6px; }
.big { font-size: 30px; font-weight: 700; color: var(--strong); padding: 4px 16px 6px; }
.conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.conn::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

.body { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.pad { padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px; }

.mark { flex: none; display: inline-block; vertical-align: middle; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); }
.mono { font-family: var(--mono); }
.wait { color: var(--waiting); }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); color: var(--strong); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--strong); color: #000; border-color: var(--strong); }
.chip.ghost { background: transparent; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.chips::-webkit-scrollbar { display: none; }
.pill { min-height: 52px; width: 100%; border-radius: 999px; background: var(--strong); color: #000; font-weight: 700; font-size: 16px; }
.pill[disabled] { opacity: .35; cursor: default; }
.rec { font-size: 11px; font-weight: 700; color: var(--accent); background: rgb(57 135 229 / .15); padding: 2px 6px; border-radius: 999px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.cmd { font-family: var(--mono); font-size: 14px; color: var(--strong); background: var(--canvas); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }

.composer { flex: none; border-top: 1px solid var(--line); padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--canvas); }
.inrow { display: flex; gap: 8px; align-items: center; }
.inrow input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--raised); color: var(--strong); padding: 0 16px; }
.inrow input::placeholder { color: var(--faint); }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--strong); color: #000; font-weight: 800; flex: none; font-size: 18px; }

.me { align-self: flex-end; max-width: 82%; background: var(--raised); color: var(--strong); padding: 9px 14px; border-radius: 18px 18px 6px 18px; white-space: pre-wrap; }
.ai { max-width: 92%; color: var(--body); white-space: pre-wrap; line-height: 1.6; }
.tool { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.sys { align-self: center; font-size: 12px; color: var(--muted); text-align: center; }

.row { display: flex; gap: 12px; padding: 12px 16px; align-items: flex-start; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .nm { color: var(--strong); font-weight: 700; font-size: 16px; }
.row .pv { color: var(--body); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgb(217 178 106 / .14); color: var(--waiting); white-space: nowrap; }
.tag.run { background: rgb(57 135 229 / .14); color: var(--accent); }
.tag.idle { background: var(--raised); color: var(--muted); }

/* inline keyboard under a bubble (Telegram style) */
.kb { display: grid; gap: 6px; margin-top: 8px; }
.kb button { min-height: 44px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); color: var(--strong); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; }
.kb button.primary { background: var(--strong); color: #000; border-color: var(--strong); }
.qbub { background: var(--card); border: 1px solid var(--line); border-radius: 18px 18px 18px 6px; padding: 12px 14px; max-width: 92%; }
.qbub .q { color: var(--strong); font-weight: 700; font-size: 16px; line-height: 1.45; }

/* toast + sheets */
.toast { position: absolute; left: 12px; right: 12px; top: 52px; z-index: 30; background: var(--raised); border: 1px solid #2b2f37; border-radius: 16px; padding: 10px 12px 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .5); }
@media (max-width: 860px) { .toast { top: 8px; } }
.toast .tx { flex: 1; min-width: 0; }
.toast .tx b { color: var(--strong); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast .tx span { font-size: 12px; color: var(--muted); }
.toast .bar { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; background: var(--muted); border-radius: 2px; transform-origin: left; animation: drain 5s linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.toast button { color: var(--strong); font-weight: 800; min-height: 44px; padding: 0 8px; }
.sheet-bg { position: absolute; inset: 0; z-index: 40; background: rgb(0 0 0 / .55); display: flex; align-items: flex-end; }
.sheet { width: 100%; max-height: 92%; background: var(--canvas); border-top: 1px solid var(--line); border-radius: 26px 26px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #3a3e46; margin: 8px auto 2px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); width: 100%; }
.opt .k { width: 28px; height: 28px; border-radius: 8px; background: var(--raised); color: var(--body); font: 700 14px var(--mono); display: grid; place-items: center; flex: none; }
.opt[aria-checked="true"] { border: 2px solid var(--strong); padding: 13px; }
.opt[aria-checked="true"] .k { background: var(--strong); color: #000; }
.opt .l { color: var(--strong); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .d { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sign { border: 1px solid rgb(217 178 106 / .45); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; background: var(--card); }
.sign div { display: flex; justify-content: space-between; gap: 12px; }
.sign span:first-child { color: var(--muted); }
.sign span:last-child { color: var(--strong); text-align: right; font-variant-numeric: tabular-nums; }
.face { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgb(0 0 0 / .35); }
.face div { background: rgb(40 42 48 / .92); border-radius: 22px; padding: 26px 30px; text-align: center; color: var(--strong); font-size: 13px; }
.face svg { display: block; margin: 0 auto 10px; }

/* focus concept */
.dots { display: flex; gap: 5px; }
.dots i { width: 18px; height: 4px; border-radius: 2px; background: var(--line); }
.dots i.on { background: var(--strong); }
.dots i.done { background: var(--muted); }
.slide { animation: slide .24s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.fq { color: var(--strong); font-size: 24px; font-weight: 700; line-height: 1.35; text-wrap: balance; }
.ctx { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 6px; }

/* bottom tab bar */
.tabbar { flex: none; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); padding-bottom: 14px; background: var(--canvas); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding-top: 8px; color: var(--muted); font-size: 11px; font-weight: 600; min-height: 52px; position: relative; }
.tabbar button[aria-current="page"] { color: var(--strong); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #000; font: 700 11px/18px var(--mono); }
.banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgb(217 178 106 / .1); border: 1px solid rgb(217 178 106 / .3); color: var(--waiting); font-size: 14px; text-align: left; width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .slide, .sheet, .toast .bar { animation: none; }
}
</style>

<div class="top">

const nameOf = s => s.name || s.id;
const REPLY = "好，這步處理完了。下一步要做什麼？\nA. 跑完整測試\nB. 先停在這裡";

let S, concept = "messages", timers = [];
function fresh() {
  timers.forEach(clearTimeout); timers = [];
  S = structuredClone(BASE);
  S.ui = {}; S.toast = null; S.sheet = null; S.face = false;
  S.chat = []; S.skipped = []; S.flow = null;
}
const later = (ms, fn) => timers.push(setTimeout(() => { fn(); render(); }, ms));

/* ---------------- 共用動作 ---------------- */
function queue(label, apply, revert, commit) {
  if (S.toast) { clearTimeout(S.toast.timer); S.toast.commit(); }
  apply();
  const t = { label, revert, commit };
  t.timer = setTimeout(() => { if (S.toast === t) { S.toast = null; commit(); render(); } }, 5000);
  S.toast = t;
  render();
}
function undo() {
  const t = S.toast; if (!t) return;
  clearTimeout(t.timer); S.toast = null; t.revert(); render();
}
function resume(sid) {
  const s = S.sessions[sid]; if (!s) return;
  s.status = "run"; s.run = "處理中"; s.time = "剛剛"; render();
  later(2200, () => { s.turns.push({ t: "讀了 3 個檔 · 改了 1 個檔" }, { a: REPLY }); s.status = "reply"; s.quick = ["A", "B", "繼續"]; onNewItem(); });
}
function onNewItem() { if (concept === "kunsu") askNext(true); }

function answer(did, idx, confirmed) {
  const i = S.decisions.findIndex(d => d.id === did); if (i < 0) return;
  const d = S.decisions[i];
  if (d.money && !confirmed) { S.sheet = { kind: "decision", id: did, sel: null }; render(); return; }
  if (d.money && d.opts[idx].rec) {
    S.face = true; render();
    later(800, () => {
      S.face = false; S.decisions.splice(i, 1);
      S.sheet = { kind: "receipt", label: d.opts[idx].l };
      afterDecision(d, d.opts[idx].l);
    });
    return;
  }
  S.sheet = null;
  const before = snap();
  queue(`「${d.opts[idx].l}」`, () => { S.decisions.splice(i, 1); afterDecision(d, d.opts[idx].l); },
    () => restore(before), () => { if (d.session) resume(d.session); });
}
function send(sid, text) {
  const s = S.sessions[sid]; if (!s || !text) return;
  const before = snap();
  queue(`「${text}」→ ${nameOf(s)}`, () => { s.turns.push({ u: text }); s.status = "run"; s.run = "等你撤回時間結束"; afterSend(s, text); },
    () => restore(before), () => resume(sid));
}
function permit(sid, allow) {
  const s = S.sessions[sid]; if (!s || !s.perm) return;
  const go = () => {
    s.turns.push({ sys: `你${allow ? "允許" : "拒絕"}了 ${s.perm.cmd}` });
    const cmd = s.perm.cmd; delete s.perm;
    afterPermit(s, allow, cmd);
    if (allow) { s.status = "run"; s.run = "推送中"; later(1800, () => { s.turns.push({ t: `執行了 ${cmd} ✓` }, { a: "推上去了。要開 PR 嗎？\nA. 開 PR\nB. 先不用" }); s.status = "reply"; s.quick = ["A", "B"]; onNewItem(); }); }
    else { s.turns.push({ a: "好，不推。要我先整理成草稿 PR 嗎？" }); s.status = "reply"; s.quick = ["好", "不用"]; }
    render();
  };
  if (allow && s.perm.risk) { S.face = true; render(); later(800, () => { S.face = false; go(); }); }
  else go();
}
// 每個版本自己的副作用（寫歷史、跳下一件……）
let afterDecision = () => {}, afterSend = () => {}, afterPermit = () => {};
function snap() { return JSON.stringify({ sessions: S.sessions, decisions: S.decisions, chat: S.chat, skipped: S.skipped, ui: S.ui, flow: S.flow }); }
function restore(j) { Object.assign(S, JSON.parse(j)); }

/* 需要你的事，越急越前面：決定 > 批准 > 回話 */
function items() {
  const out = [];
  S.decisions.forEach(d => out.push({ kind: "decision", id: "d:" + d.id, d }));
  Object.values(S.sessions).filter(s => s.status === "perm" && s.perm).forEach(s => out.push({ kind: "perm", id: "p:" + s.id, s }));
  Object.values(S.sessions).filter(s => s.status === "reply").forEach(s => out.push({ kind: "reply", id: "r:" + s.id, s }));
  const skip = S.skipped;
  return out.sort((a, b) => skip.indexOf(a.id) - skip.indexOf(b.id));
}
const running = () => Object.values(S.sessions).filter(s => s.status === "run");

        <div class="inrow"><input id="msg" placeholder="回覆 ${esc(nameOf(s))}…" autocomplete="off"><button class="send" data-a="sendmsg" data-v="${s.id}" aria-label="送出">↑</button></div>`;
    }
    const sid = it.kind === "decision" ? it.d.session : it.s.id;
    return head + `<div class="body"><div class="pad slide" style="padding-top:18px" key="${it.id}">${body}
        ${sid ? `<button class="meta" data-a="transcript" data-v="${sid}" style="text-align:left;min-height:40px">看完整對話 ›</button>` : ""}</div></div>
      <div class="composer" style="gap:10px">${foot}<button class="meta" data-a="skip" data-v="${it.id}" style="min-height:40px">等下再說</button></div>`;
  },
  all(list) {
    return `<div class="body"><div class="pad"><div class="hdr" style="padding:0;border:0"><div class="t">全部</div><span class="sp"></span><button class="meta" data-a="all" style="min-height:44px">回到處理</button></div>
      <div class="lbl">還在等你 · ${list.length}</div>
      ${list.map(it => { const a = it.kind === "decision" ? it.d.agent : it.s.agent; const n = it.kind === "decision" ? it.d.project : nameOf(it.s); const t = it.kind === "decision" ? it.d.q : it.kind === "perm" ? "要執行 " + it.s.perm.cmd : (it.s.turns.filter(x => x.a).pop() || {}).a;
        return `<button class="row" style="padding-inline:0" data-a="jump" data-v="${it.id}">${mark(a, 26)}<span class="mid"><span class="nm" style="font-size:15px">${esc(n)}</span><span class="pv">${esc(t)}</span></span></button>`; }).join("")}
      <div class="lbl" style="margin-top:12px">其他對話</div>
      ${Object.values(S.sessions).filter(s => s.status === "run" || s.status === "idle").map(s => `<button class="row" style="padding-inline:0" data-a="transcript" data-v="${s.id}">${mark(s.agent, 26)}<span class="mid"><span class="nm" style="font-size:15px">${esc(nameOf(s))}</span><span class="pv">${s.status === "run" ? esc(s.run) : "閒置"}</span></span></button>`).join("")}
      <button class="chip" data-a="new" style="align-self:flex-start;margin-top:8px">＋ 開新對話</button></div></div>`;
  },
};

/* =========================================================
   3. 軍師一問一答
   ========================================================= */
function askNext(fromIdle) {
  if (concept !== "kunsu") return;
  if (S.flow && S.flow.current && items().some(i => i.id === S.flow.current)) return;
  const it = items()[0];
  S.flow = S.flow || {};
  if (!it) {
    if (!S.flow.idleSaid) {
      const r = running();
      S.chat.push({ k: r.length ? `目前沒有事在等你。${r.map(s => nameOf(s) + " " + s.run).join("、")}，好了我再叫你。` : "目前沒有事在等你。" });
      S.flow.idleSaid = true;
    }
    S.flow.current = null; return;
  }
  S.flow.idleSaid = false;
  S.flow.current = it.id;
  if (it.kind === "decision") { const d = it.d; S.chat.push({ k: `${AGENT[d.agent]}（${d.project}）要你決定：\n${d.q}\n\n${d.why}`, mk: d.agent, ask: it.id }); }
  else if (it.kind === "perm") { const s = it.s; S.chat.push({ k: `${nameOf(s)} 要執行：`, cmd: s.perm.cmd, k2: s.perm.why + (s.perm.risk ? "\n允許需要 Face ID。" : ""), mk: s.agent, ask: it.id }); }
  else { const s = it.s; S.chat.push({ k: `${nameOf(s)} 問你：\n${(s.turns.filter(t => t.a).pop() || {}).a}`, mk: s.agent, ask: it.id, sid: s.id }); }
}
const C3 = {
  title: "軍師一問一答",
  one: "只有一個聊天對象：軍師。它一次只問你一件事，你回完它才問下一件。",
  why: ["真正的單一對話，沒有卡片：選項就是輸入框上方的快速回覆。", "因為一次只問一件，你打的任何字都很清楚是在回這一件，不用選回覆對象。", "開新對話也是跟軍師說：它會問你要給誰、哪個專案、做什麼。"],
  risk: ["一定要照順序，不能跳著回（可以按「等下再說」）。", "看不到全局，要靠軍師說「還有 N 件」。"],
  try: "一路用快速回覆回完；中間按「等下再說」；最後按「＋」開一段新對話。",
  render() {
    if (!S.chat.length) { S.chat.push({ k: "晚安。有幾件事在等你，我一件一件問。" }); askNext(); }
    const list = items(), cur = list.find(i => i.id === (S.flow && S.flow.current));
    const nf = S.ui.newflow;
    let chips = [];
    if (nf) {
      if (!nf.agent) chips = [["Claude", "nf-agent", "claude"], ["Codex", "nf-agent", "codex"]];
      else if (!nf.project) chips = ["kunsu", "ads-review", "blog-site", "demo-shop"].map(p => [p, "nf-proj", p]);
      chips.push(["取消", "nf-cancel", ""]);
    } else if (cur) {
      if (cur.kind === "decision") chips = cur.d.money ? [["打開核對（Face ID）", "dec", cur.d.id, -1]] : cur.d.opts.map((o, i) => [o.l + (o.rec ? " ★" : ""), "dec", cur.d.id, i]);
      else if (cur.kind === "perm") chips = [["允許一次", "perm", cur.s.id, 1], ["拒絕", "perm", cur.s.id, 0]];
      else chips = (cur.s.quick || ["繼續"]).map(q => [q, "quick", cur.s.id, q]);
      chips.push(["等下再說", "skip", cur.id]);
      const sid = cur.kind === "decision" ? cur.d.session : cur.s.id;
      if (sid) chips.push(["看完整對話", "transcript", sid]);
    }
    const ph = nf ? (nf.project ? "要做什麼？" : "選一個") : cur ? (cur.kind === "reply" ? `回覆 ${nameOf(cur.s)}…` : cur.kind === "decision" ? "要補充說明可以打字" : "用上面的按鈕回答") : "跟軍師說…";
    return `<div class="sbar"><span>23:44</span><i></i></div>
      <div class="hdr">${mark("k", 30)}<div><div class="t">軍師</div><div class="meta" style="font-size:12px">${list.length ? `還有 ${list.length} 件在等你` : "沒有事在等你"}</div></div><span class="sp"></span><span class="conn">Mac</span></div>
      <div class="body" data-bottom><div class="pad">${S.chat.map(m => m.me ? `<div class="me">${esc(m.me)}</div>` :
        `<div style="display:flex;gap:8px;align-items:flex-end">${mark(m.mk || "k", 22)}<div class="qbub" style="${m.ask && m.ask === (S.flow && S.flow.current) ? "border-color:#3a3e46" : "opacity:.85"}"><div style="white-space:pre-wrap;color:var(--strong)">${esc(m.k)}</div>${m.cmd ? `<div class="cmd" style="margin:8px 0">${esc(m.cmd)}</div><div class="meta" style="white-space:pre-wrap">${esc(m.k2)}</div>` : ""}</div></div>`).join("")}</div></div>
      <div class="composer"><div class="chips">${chips.map(([l, a, v, i], n) => `<button class="chip ${n === 0 && a !== "skip" ? "on" : a === "skip" || a === "transcript" || a === "nf-cancel" ? "ghost" : ""}" data-a="${a}" data-v="${esc(v)}" data-i="${i ?? ""}" data-t="${esc(i ?? "")}">${esc(l)}</button>`).join("")}</div>
        <div class="inrow"><button class="chip" data-a="nf-start" aria-label="開新對話" style="width:44px;padding:0;justify-content:center;font-size:20px">＋</button><input id="msg" placeholder="${esc(ph)}" autocomplete="off" ${cur && cur.kind === "perm" && !nf ? "disabled" : ""}><button class="send" data-a="k-send" aria-label="送出">↑</button></div></div>`;
  },
};

/* =========================================================
   4. 分成兩頁
   ========================================================= */
const C4 = {
  title: "分成兩頁",
  one: "下面兩個分頁：「決定」只有按鈕，「對話」只有打字。兩種動作永遠不會出現在同一個畫面。",
  why: ["一看就知道現在要「按」還是要「打」。", "「決定」頁是清單，可以一口氣按完所有要拍板的事。", "「對話」頁是乾淨的聊天，像 Claude App 一樣。"],
  risk: ["同一段對話的東西被拆在兩頁（kunsu 的決定在一頁、回話在另一頁）。", "要靠紅點提醒你另一頁還有事。"],
  try: "在「決定」把題目按完，再切到「對話」回 kunsu。",
  render() {
    const tab = S.ui.tab || "dec";
    const nDec = S.decisions.length + Object.values(S.sessions).filter(s => s.perm).length;
    const nChat = Object.values(S.sessions).filter(s => s.status === "reply").length;
    let main;
    if (tab === "dec") {
      const cards = [];
      S.decisions.forEach(d => cards.push(`<div class="card"><div style="display:flex;gap:8px;align-items:center" class="meta">${mark(d.agent, 16)} <b style="color:var(--body)">${esc(d.project)}</b><span style="flex:1"></span>${d.money ? '<span class="tag">動錢</span>' : ""}${d.time}</div>
        <div style="color:var(--strong);font-weight:700;font-size:16px">${esc(d.q)}</div>
        <div class="chips" style="flex-wrap:wrap">${d.money ? `<button class="chip on" data-a="dec" data-v="${d.id}" data-i="-1">打開核對（Face ID）</button>` : d.opts.map((o, i) => `<button class="chip ${o.rec ? "on" : ""}" data-a="dec" data-v="${d.id}" data-i="${i}">${esc(o.l)}${o.rec ? " ★" : ""}</button>`).join("")}</div></div>`));
      Object.values(S.sessions).filter(s => s.perm).forEach(s => cards.push(`<div class="card"><div style="display:flex;gap:8px;align-items:center" class="meta">${mark(s.agent, 16)} <b style="color:var(--body)">${esc(nameOf(s))}</b><span style="flex:1"></span>要你批准</div>
        <div class="cmd">${esc(s.perm.cmd)}</div><div class="meta">${esc(s.perm.why)}</div>
        <div class="chips"><button class="chip" data-a="perm" data-v="${s.id}" data-i="0">拒絕</button><button class="chip on" data-a="perm" data-v="${s.id}" data-i="1">允許一次${s.perm.risk ? " · Face ID" : ""}</button></div></div>`));
      main = `<div class="big">決定</div><div class="body"><div class="pad">${cards.join("") || `<div class="meta" style="text-align:center;padding:60px 0">沒有要你拍板的事</div>`}
        ${nChat ? `<button class="banner" data-a="tab" data-v="chat">💬 還有 ${nChat} 段對話等你回話 ›</button>` : ""}</div></div>`;
    } else if (S.ui.thread && S.sessions[S.ui.thread]) {
      const s = S.sessions[S.ui.thread];
      const pending = S.decisions.some(d => d.session === s.id) || s.perm;
      main = `<div class="hdr"><button class="back" data-a="home">‹ 對話</button>${mark(s.agent, 22)}<div><div class="t" style="font-size:15px">${esc(nameOf(s))}</div><div class="sub">${esc(s.branch)}</div></div></div>
        <div class="body" data-bottom><div class="pad">${pending ? `<button class="banner" data-a="tab" data-v="dec">這段有一件事要你在「決定」按 ›</button>` : ""}${turnsHTML(s)}${s.status === "run" ? `<div class="tool">… ${esc(s.run)}</div>` : ""}</div></div>
        <div class="composer">${s.status === "reply" ? `<div class="chips">${(s.quick || ["繼續"]).map(q => `<button class="chip ${q === "繼續" ? "on" : ""}" data-a="quick" data-v="${s.id}" data-t="${esc(q)}">${esc(q)}</button>`).join("")}</div>` : ""}
          <div class="inrow"><input id="msg" placeholder="傳給 ${esc(nameOf(s))}…" autocomplete="off"><button class="send" data-a="sendmsg" data-v="${s.id}" aria-label="送出">↑</button></div></div>`;
    } else {
      const order = { reply: 0, perm: 1, run: 2, idle: 3 };
      main = `<div class="big">對話</div><div class="body">${Object.values(S.sessions).sort((a, b) => order[a.status] - order[b.status]).map(s => {
        const tag = s.status === "reply" ? ["等你回話", ""] : s.status === "run" ? ["執行中", "run"] : s.status === "perm" ? ["在「決定」", "idle"] : ["", ""];
        return `<button class="row" data-a="open" data-v="${s.id}">${mark(s.agent, 36)}<span class="mid"><span class="nm">${esc(nameOf(s))}</span><span class="pv">${esc((s.turns.filter(t => t.a).pop() || { a: "" }).a)}</span></span><span class="rt"><span class="meta">${s.time}</span>${tag[0] ? `<span class="tag ${tag[1]}">${tag[0]}</span>` : ""}</span></button>`; }).join("")}
        <div style="padding:16px"><button class="chip" data-a="new">＋ 開新對話</button></div></div>`;
    }
    return `<div class="sbar"><span>23:44</span><i></i></div>${main}
      <nav class="tabbar"><button data-a="tab" data-v="dec" aria-current="${tab === "dec" ? "page" : "false"}"><span style="font-size:20px">☑︎</span>決定${nDec ? `<span class="badge">${nDec}</span>` : ""}</button>
      <button data-a="tab" data-v="chat" aria-current="${tab === "chat" ? "page" : "false"}"><span style="font-size:20px">💬</span>對話${nChat ? `<span class="badge">${nChat}</span>` : ""}</button></nav>`;
  },
};

const CONCEPTS = { messages: C1, focus: C2, kunsu: C3, tabs: C4 };
const ORDER = ["messages", "focus", "kunsu", "tabs"];

/* 每個版本的副作用 */
function wire() {
  afterDecision = afterSend = afterPermit = () => {};
  if (concept === "focus") {
    const bump = () => { S.ui.done = (S.ui.done || 0) + 1; };
    afterDecision = bump; afterSend = bump; afterPermit = bump;
  }
  if (concept === "kunsu") {
    afterDecision = (d, l) => { S.chat.push({ me: l }, { k: `好，轉給 ${d.project} 了。` }); S.flow.current = null; askNext(); };
    afterSend = (s, t) => { S.chat.push({ me: t }, { k: `好，轉給 ${nameOf(s)} 了。` }); S.flow.current = null; askNext(); };
    afterPermit = (s, allow) => { S.chat.push({ me: allow ? "允許一次" : "拒絕" }, { k: allow ? `好，${nameOf(s)} 開始推。` : `好，跟 ${nameOf(s)} 說不要推。` }); S.flow.current = null; askNext(); };
  }
}

/* ---------------- render + events ---------------- */
const phone = document.getElementById("phone");
function render() {
  const c = CONCEPTS[concept];
  const keepInput = document.getElementById("msg");
  const draft = keepInput ? keepInput.value : "";
  const hadFocus = document.activeElement === keepInput;
  phone.innerHTML = `<div class="scr">${c.render()}</div>${overlays()}`;
  const inp = document.getElementById("msg");
  if (inp && draft) inp.value = draft;
  if (inp && hadFocus) inp.focus();
  phone.querySelectorAll("[data-bottom]").forEach(b => b.scrollTop = b.scrollHeight);
}
function renderChrome() {
  document.getElementById("tabs").innerHTML = ORDER.map((k, i) => `<button type="button" data-c="${k}" aria-pressed="${k === concept}"><span class="n">${i + 1}</span>${CONCEPTS[k].title}</button>`).join("");
  const c = CONCEPTS[concept];
  document.getElementById("notes").innerHTML = `<h2>${c.title}</h2><p class="one">${c.one}</p>
    <h3>為什麼可能比較直覺</h3><ul>${c.why.map(x => `<li>${x}</li>`).join("")}</ul>
    <h3>風險</h3><ul>${c.risk.map(x => `<li>${x}</li>`).join("")}</ul>
    <div class="try"><b>試試看：</b>${c.try}</div>
    <h3>四個版本共用的規則</h3><ul><li>決定題只能用按鈕回答，打字永遠不會變成正式答案。</li><li>動錢一定要打開核對、自己選、Face ID。</li><li>其他送出都有 5 秒撤回。</li><li>權限預設 Auto：一般動作 AI 自己做，高風險才回來問。</li></ul>`;
}
function setConcept(k) {
  concept = k; fresh(); wire();
  try { localStorage.setItem("kunsu-mobile-concept", k); } catch (e) {}
  renderChrome(); render();
}

document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (b) setConcept(b.dataset.c); });
document.getElementById("reset").addEventListener("click", () => setConcept(concept));

phone.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, i = el.dataset.i;
  if (a === "bgclose" && e.target !== el) return;
  const inp = () => { const x = document.getElementById("msg"); const t = x ? x.value.trim() : ""; if (x) x.value = ""; return t; };
  switch (a) {
    case "undo": undo(); break;
    case "close": case "bgclose": S.sheet = null; render(); break;
    case "home": S.ui.thread = null; render(); break;
    case "open": S.ui.thread = v; if (concept === "tabs") S.ui.tab = "chat"; render(); break;
    case "opendec": S.ui.thread = "blog"; render(); break;
    case "dec": {
      const d = S.decisions.find(x => x.id === v);
      if (d && d.money) { S.sheet = { kind: "decision", id: v, sel: null }; render(); }
      else answer(v, +i);
      break;
    }
    case "pick": S.sheet.sel = +i; render(); break;
    case "sheetsubmit": answer(S.sheet.id, S.sheet.sel, true); break;
    case "perm": permit(v, i === "1"); break;
    case "quick": send(v, el.dataset.t); break;
    case "sendmsg": { const t = inp(); if (t) send(v, t); break; }
    case "transcript": S.sheet = { kind: "transcript", id: v }; render(); break;
    case "skip": S.skipped = S.skipped.filter(x => x !== v); S.skipped.push(v);
      if (concept === "kunsu") { S.chat.push({ me: "等下再說" }, { k: "好，排到最後。" }); S.flow.current = null; askNext(); }
      render(); break;
    case "all": S.ui.all = !S.ui.all; render(); break;
    case "jump": S.ui.all = false; S.skipped = items().map(x => x.id).filter(x => x !== v); render(); break;
    case "tab": S.ui.tab = v; S.ui.thread = null; render(); break;
    case "new": S.sheet = { kind: "new", agent: "claude", project: "kunsu" }; render(); break;
    case "nagent": S.sheet.agent = v; render(); break;
    case "nproj": S.sheet.project = v; render(); break;
    case "nstart": { const x = document.getElementById("newtext"); const t = x && x.value.trim(); if (!t) { x && x.focus(); break; }
      const id = startNew(S.sheet.agent, S.sheet.project, t); S.sheet = null; if (concept === "messages") S.ui.thread = id; if (concept === "tabs") { S.ui.tab = "chat"; S.ui.thread = id; } render(); break; }
    case "nf-start": S.ui.newflow = {}; S.chat.push({ me: "開新對話" }, { k: "要給誰？" }); render(); break;
    case "nf-agent": S.ui.newflow.agent = v; S.chat.push({ me: AGENT[v] }, { k: "哪個專案？" }); render(); break;
    case "nf-proj": S.ui.newflow.project = v; S.chat.push({ me: v }, { k: "要做什麼？直接打字。" }); render(); break;
    case "nf-cancel": S.ui.newflow = null; S.chat.push({ me: "算了" }, { k: "好。" }); render(); break;
    case "k-send": {
      const t = inp(); if (!t) break;
      const nf = S.ui.newflow;
      if (nf && nf.project) { S.ui.newflow = null; startNew(nf.agent, nf.project, t); S.chat.push({ me: t }, { k: `好，開了一段新的 ${AGENT[nf.agent]} 對話在 ${nf.project}，有事我再問你。` }); render(); break; }
      const cur = items().find(x => x.id === (S.flow && S.flow.current));
      if (cur && cur.kind === "reply") send(cur.s.id, t);
      else if (cur && cur.kind === "decision") { S.chat.push({ me: t }, { k: "這題要點上面的選項回答；你打的字我先記成補充說明。" }); render(); }
      else { S.chat.push({ me: t }, { k: "現在沒有事在等你。要開新對話的話按左邊的「＋」。" }); render(); }
      break;
    }
  }
});
phone.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing) return;
  if (e.target.id === "msg") { const b = phone.querySelector('[data-a="sendmsg"],[data-a="k-send"]'); if (b) b.click(); }
  if (e.target.id === "newtext") { const b = phone.querySelector('[data-a="nstart"]'); if (b) b.click(); }
});

let start = "messages";
try { start = localStorage.getItem("kunsu-mobile-concept") || "messages"; } catch (e) {}
if (location.hash && CONCEPTS[location.hash.slice(1)]) start = location.hash.slice(1);
setConcept(CONCEPTS[start] ? start : "messages");
</script>
